<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Data Export & Import Tab</title>
  <!-- PapaParse CDN for CSV parsing and unparsing -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 20px;
      background-color: #f4f5f7;
      color: #333;
    }

    .export-import-panel {
      max-width: 600px;
      margin: 0 auto;
      background: #ffffff;
      padding: 24px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .section-group {
      margin-bottom: 20px;
    }

    .section-group h2 {
      margin-top: 0;
      border-bottom: 2px solid #eaeaea;
      padding-bottom: 8px;
      font-size: 1.2rem;
      color: #111;
    }

    .import-group {
      margin-bottom: 15px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    label {
      font-weight: 600;
      font-size: 0.9rem;
    }

    input[type="url"],
    input[type="file"] {
      padding: 8px 12px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 0.9rem;
    }

    button {
      padding: 10px 16px;
      background-color: #0066cc;
      color: white;
      border: none;
      border-radius: 4px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    button:hover {
      background-color: #0052a3;
    }

    hr {
      border: 0;
      border-top: 1px solid #eee;
      margin: 20px 0;
    }
  </style>
</head>
<body>

<div class="export-import-panel">
  <!-- Export Section -->
  <div class="section-group">
    <h2>Export Local Data</h2>
    <p>Download your current data as a CSV backup file.</p>
    <button id="btnExportCsv">Export Data to CSV</button>
  </div>

  <hr>

  <!-- Import Section -->
  <div class="section-group">
    <h2>Import Data</h2>
    
    <!-- Option A: File Upload -->
    <div class="import-group">
      <label for="csvFileInput">Upload CSV File:</label>
      <input type="file" id="csvFileInput" accept=".csv" />
    </div>

    <!-- Option B: Google Sheets URL -->
    <div class="import-group">
      <label for="sheetUrlInput">Or Google Sheets Published CSV URL:</label>
      <input type="url" id="sheetUrlInput" placeholder="https://docs.google.com/spreadsheets/d/e/.../pub?output=csv" />
      <button id="btnFetchSheet">Import from URL</button>
    </div>
  </div>
</div>

<script>
  // Key used in LocalStorage to store your app's data array
  const STORAGE_KEY = 'app_local_data';

  /**
   * Helper to retrieve current local storage data
   */
  function getLocalData() {
    const raw = localStorage.getItem(STORAGE_KEY);
    try {
      return raw ? JSON.parse(raw) : [];
    } catch (e) {
      console.error('Error reading local storage:', e);
      return [];
    }
  }

  /**
   * Export local storage array to CSV
   */
  function exportToCsv() {
    const data = getLocalData();
    if (!data || data.length === 0) {
      alert('No data available to export.');
      return;
    }

    const csv = Papa.unparse(data);
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.setAttribute('download', 'backup_data.csv');
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  }

  /**
   * Validate schema before restoring
   */
  function isValidSchema(data) {
    return Array.isArray(data) && data.length > 0 && typeof data[0] === 'object';
  }

  /**
   * Save parsed dataset into local storage and update state
   */
  function restoreLocalData(data) {
    if (!isValidSchema(data)) {
      alert('Invalid CSV format or empty dataset.');
      return;
    }
    
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    alert('Data successfully imported and restored!');
    window.location.reload();
  }

  /**
   * Handle direct file upload (.csv)
   */
  function importFromLocalFile(file) {
    Papa.parse(file, {
      header: true,
      skipEmptyLines: true,
      dynamicTyping: true,
      complete: (results) => {
        restoreLocalData(results.data);
      },
      error: (err) => {
        console.error('File parsing error:', err);
        alert('Failed to parse CSV file.');
      }
    });
  }

  /**
   * Handle public Google Sheets CSV link
   */
  function importFromGoogleSheetUrl(csvUrl) {
    Papa.parse(csvUrl, {
      download: true,
      header: true,
      skipEmptyLines: true,
      dynamicTyping: true,
      complete: (results) => {
        restoreLocalData(results.data);
      },
      error: (err) => {
        console.error('Fetch error:', err);
        alert('Failed to fetch CSV from provided URL.');
      }
    });
  }

  // Event Listeners
  document.getElementById('btnExportCsv').addEventListener('click', exportToCsv);

  document.getElementById('csvFileInput').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) importFromLocalFile(file);
  });

  document.getElementById('btnFetchSheet').addEventListener('click', () => {
    const url = document.getElementById('sheetUrlInput').value.trim();
    if (url) importFromGoogleSheetUrl(url);
  });
</script>

</body>
</html>
